name: Harness contract

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  corpus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact harness checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check shell syntax
        run: |
          for script in bin/cockswain-* bin/import-chatgpt-export tests/test-corpus-cases.sh tests/test-behavior-cases.sh tests/test-merge-state.sh tests/test-pr-retirement.sh tests/test-retirement-loop.sh tests/test-owner-records.sh tests/test-authority-receipt.sh tests/test-authority-decision.sh tests/test-authority-collector.sh; do
            sh -n "$script"
          done
      - name: Verify verbatim corpus evaluation contract
        run: sh tests/test-corpus-cases.sh
      - name: Verify privacy-reduced behavior regressions
        run: sh tests/test-behavior-cases.sh
      - name: Consume deterministic merge blockers without model inference
        run: sh tests/test-merge-state.sh
      - name: Keep open PRs in the retirement loop
        run: sh tests/test-pr-retirement.sh
      - name: Drain READY retirements with durable failed-write state
        run: sh tests/test-retirement-loop.sh
      - name: Reconcile complete owner records without losing attempts
        run: sh tests/test-owner-records.sh
      - name: Fetch the pinned account collection contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: e8bbab7e64048d0d2af7788f3356670d65c3cd59
          path: .ci-ai-ci
          persist-credentials: false
      - name: Verify the collector and supervisor handoff
        run: |
          export COCKSWAIN_PR_RETIREMENT="$GITHUB_WORKSPACE/bin/cockswain-pr-retirement"
          sh .ci-ai-ci/tests/merge-account.sh
          sh .ci-ai-ci/tests/merge-collector.sh
      - name: Preserve contextual authority provenance
        run: |
          sh tests/test-authority-receipt.sh
          sh tests/test-authority-decision.sh
          sh tests/test-authority-collector.sh
