name: Retirement adapter qualification
on:
  pull_request:
    paths:
      - 'bin/cockswain-collect-account'
      - 'bin/cockswain-action-live'
      - 'tests/retirement-live-adapters.sh'
      - '.github/workflows/retirement-adapter-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - name: Offline contract test (no GitHub writes)
        run: sh tests/retirement-live-adapters.sh
